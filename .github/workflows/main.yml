name: t
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: run
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: go
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION: ${{ secrets.SESSION }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          ACCESS_HASH: ${{ secrets.ACCESS_HASH }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          SB_URL: ${{ secrets.SB_URL }}
          SB_KEY: ${{ secrets.SB_KEY }}
          SHARD: ${{ secrets.SHARD }}
          QUEUE_URL: ${{ secrets.QUEUE_URL }}
          LINK_T: ${{ secrets.LINK_T }}
          LINK_K: ${{ secrets.LINK_K }}
          CAP_T: ${{ secrets.CAP_T }}
          CAP_K: ${{ secrets.CAP_K }}
          ST_DOC: ${{ secrets.ST_DOC }}
          MAX_EPS_RUN: ${{ secrets.MAX_EPS_RUN }}
        run: python app.py
